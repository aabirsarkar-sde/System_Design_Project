# Load variables from a root `.env` (DATABASE_URL, FRONTEND_ORIGIN, SITE_BASE_URL,
# SESSION_SECRET, NODE_ENV, PORT). Compose interpolates ${SITE_BASE_URL} from that file.
#
# NEXT ↔ API: Browser hits SITE_URL on port 8000; Next server calls api:4000 on Docker network.
# Set FRONTEND_ORIGIN on the API to the same origin as SITE_BASE_URL.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_BASE_URL: http://api:4000
        SITE_BASE_URL: ${SITE_BASE_URL}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BACKEND_API_BASE_URL: http://api:4000
      PORT: "8000"
    depends_on:
      - api
